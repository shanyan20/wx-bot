name: Python checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: personal-wechat-bot
          auto-activate-base: false
      - run: python scripts/wechat_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-tests-${{ matrix.os }}
          path: data/wechat-tests/
