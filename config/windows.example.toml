[app]
database = "../data/windows.sqlite3"
logs = "../data/logs/windows.log"
heartbeat = "../data/windows-heartbeat.json"
pause_file = "../data/PAUSE"

[adapter]
type = "windows_uia"

[rules]
private_allowlist = ["friend-test"]
group_allowlist = []
group_prefix = "/问 "

[model]
provider = "echo"

[windows]
verified = false

[[windows.chats]]
id = "friend-test"
chat_type = "private"
process_id = 0                         # TODO(T01)：本次登录的真实微信进程 PID
