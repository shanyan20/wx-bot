# 实验性模板，不是某个微信版本的已验证控件配置！不可直接运行。
# TODO(T01/T02)：必须按 docs/WECHAT_ADAPTER.md 完成字段与身份验证。
[app]
database = "../data/windows.sqlite3"
logs = "../data/logs/windows.log"
heartbeat = "../data/windows-heartbeat.json"
pause_file = "../data/PAUSE"

[adapter]
type = "windows_uia"

[rules]
private_allowlist = ["friend-test"]
group_allowlist = []
group_prefix = "/问 "

[model]
provider = "echo"

[windows]
verified = false

[[windows.chats]]
id = "friend-test"
chat_type = "private"
# 2026-09-10 实测：标题为 shanyan 的顶层窗口属于 PID 13168。
# PID 仅对本次客户端运行有效；微信重启后须重新核对。
process_id = 13168
window_title = "shanyan"
# 2026-09-10 经用户授权热激活 Qt gate 后，已读取下列标题/列表/输入控件。
# 标题文本来自实际标题子控件；此结果仅对当前实例做过读取验证。
# 保持 verified=false；以下 TODO 未解决前无法启用真实收发。
header_id = "content_view.top_content_view.title_h_view.left_v_view.left_content_v_view.left_ui_.big_title_line_h_view.current_chat_name_label"
header_text = "shanyan"
list_id = "chat_message_list"
input_id = "chat_input_field"
# 发送按钮存在但 AutomationId 为空；消息行 ID 重复，原适配器尚不兼容。
send_button_id = "TODO_发送按钮AutomationId"
